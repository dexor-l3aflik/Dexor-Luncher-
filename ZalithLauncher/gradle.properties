
# Project-wide Gradle settings.
# IDE users: settings configured through the IDE override these values.

# JVM arguments
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Gradle parallel mode
# org.gradle.parallel=true

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Android resource settings
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false

# Launcher name & URL
launcher_name=LMC CRAFT
launcher_app_name=LMC CRAFT
launcher_short_name=LMC
url_home=https://github.com/dexor-l3aflik/Dexor-Luncher-

# OAuth client ID (optional)
# oauth_client_id=xxx

# CurseForge API key (optional)
# curseforge_api_key=xxx

# Debug signing credentials
# Replace both values with NEW credentials.
default_store_password=REPLACE_WITH_NEW_STORE_PASSWORD
default_key_password=REPLACE_WITH_NEW_KEY_PASSWORD

# Launcher version
launcher_version_code=200049
launcher_version_name=1.0.0
