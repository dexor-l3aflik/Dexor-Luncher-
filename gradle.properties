
# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Android resource settings
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false

# LMC CRAFT Branding
launcher_name=LMC CRAFT
launcher_app_name=LMC CRAFT
launcher_short_name=LMC
url_home=https://github.com/dexor-l3aflik/Dexor-Luncher-

# OAuth (optional)
# oauth_client_id=xxx

# CurseForge (optional)
# curseforge_api_key=xxx

# Debug signing credentials
default_store_password=YOUR_ACTUAL_STORE_PASSWORD
default_key_password=YOUR_ACTUAL_KEY_PASSWORD

# Launcher version
launcher_version_code=200049
launcher_version_name=1.0.0
